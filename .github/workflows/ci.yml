name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm DEBE instalarse antes de setup-node: con `cache: pnpm`, setup-node
      # ejecuta `pnpm store path` al preparar el cache.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `next lint` esta obsoleto y `pnpm typecheck`/`pnpm check` no existen en
      # package.json (scripts reales: dev, build, start, lint, test).
      - name: Lint
        run: pnpm exec eslint .
        # Deuda de lint heredada: se registra sin bloquear. Quitar este
        # continue-on-error cuando el repositorio este en cero avisos.
        continue-on-error: true
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
